services:
  stage3-crypto:
    build:
      context: ./stages/stage3-crypto
      dockerfile: Dockerfile
    container_name: stage3-crypto
    ports:
      - "5000:5000"
    volumes:
      - ./stages/stage3-crypto/oracle.py:/app/oracle.py
    networks:
      - stage3-net
      - backend
    restart: unless-stopped
    environment:
      - KEY=SECRET
      - FLAG=SHADOWNET{7h_0f_7h3_3ncrypt10n_1s_4w3s0m3}

  stage6-re:
    build:
      context: ./stages/stage6-reverse-engineering
      dockerfile: Dockerfile
    container_name: stage6-re
    ports:
      - "2222:22"
    networks:
      - stage6-net
      - backend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  stage3-net:
    driver: bridge
  stage6-net:
    driver: bridge
